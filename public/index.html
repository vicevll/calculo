<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#020204;--text:#f5f5f7;--muted:#9999a6;--blue:#6da7ff;--violet:#ad91ff;--cyan:#68e4ff;--line:rgba(255,255,255,.13);--font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}body{min-height:100svh;overflow:hidden}body:before{content:'';position:fixed;inset:0;z-index:5;pointer-events:none;opacity:.14;background-image:radial-gradient(rgba(255,255,255,.8) .45px,transparent .65px);background-size:4px 4px;mix-blend-mode:screen}.scene{position:relative;min-height:100svh;overflow:hidden;background:radial-gradient(ellipse at 75% 48%,rgba(74,65,130,.2),transparent 35%),radial-gradient(ellipse at 18% 84%,rgba(24,73,116,.15),transparent 32%),#020204}.scene:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(2,2,4,.5),transparent 45%,rgba(2,2,4,.12)),radial-gradient(ellipse at center,transparent 36%,rgba(0,0,0,.72) 100%)}.topbar{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:28px 5vw}.brand{color:var(--text);font-size:.75rem;font-weight:800;letter-spacing:.2em;text-decoration:none;text-transform:uppercase}.brand span{color:var(--blue)}.coords{color:#63636e;font:400 .56rem 'DM Mono',monospace;letter-spacing:.16em;text-transform:uppercase}.hero{position:relative;z-index:2;display:grid;grid-template-columns:minmax(350px,.78fr) minmax(500px,1.22fr);align-items:center;gap:2vw;width:min(1440px,100%);min-height:100svh;margin:auto;padding:70px 5vw 30px}.copy{position:relative;z-index:3;max-width:570px;padding-bottom:20px}.kicker{display:flex;align-items:center;gap:10px;margin-bottom:25px;color:#898995;font:500 .63rem 'DM Mono',monospace;letter-spacing:.22em;text-transform:uppercase}.kicker:before{content:'';width:28px;height:1px;background:var(--blue);box-shadow:0 0 12px var(--blue)}h1{max-width:620px;font-size:clamp(3.6rem,6.6vw,7.8rem);font-weight:900;letter-spacing:-.095em;line-height:.86;text-align:left;text-wrap:balance;animation:rise .9s ease both}h1 span{display:block;background:linear-gradient(105deg,#fff 4%,#9dbdff 44%,#bb9fff 76%,#fff);background-size:230% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}.description{max-width:340px;margin:31px 0 33px;color:#aaaab5;font-size:1rem;font-weight:400;line-height:1.6;text-align:left;animation:rise .9s .13s ease both}.description strong{color:#e6e6ef;font-weight:600}.enter{display:inline-flex;align-items:center;gap:18px;padding:15px 18px 15px 22px;border:1px solid rgba(255,255,255,.26);color:#fff;background:rgba(255,255,255,.07);font-size:.7rem;font-weight:700;letter-spacing:.2em;text-decoration:none;text-transform:uppercase;transition:background .25s,border-color .25s,transform .25s,box-shadow .25s;animation:rise .9s .22s ease both}.enter span{display:grid;place-items:center;width:27px;height:27px;border:1px solid rgba(255,255,255,.32);font-size:1rem;line-height:1;transition:transform .25s}.enter:hover{border-color:var(--blue);background:rgba(94,145,255,.15);box-shadow:0 0 35px rgba(83,137,255,.18);transform:translateY(-3px)}.enter:hover span{transform:translateX(3px)}.visual{position:relative;height:min(84vh,820px);min-height:510px;z-index:1}.visual canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.visual-label{position:absolute;right:4%;bottom:9%;color:#61616d;font:400 .56rem 'DM Mono',monospace;letter-spacing:.16em;text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg)}@keyframes shine{to{background-position:230% center}}@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}@media(max-width:900px){body{overflow:auto}.scene{min-height:100svh}.hero{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:0;padding:105px 8vw 28px}.copy{padding:0;max-width:650px}.visual{height:58vh;min-height:390px;margin-top:-15px}.visual-label{display:none}h1{font-size:clamp(3.2rem,11vw,5.8rem)}.description{margin:23px 0 25px;font-size:.92rem}.coords{display:none}}@media(max-width:520px){.topbar{padding:23px 20px}.hero{padding:95px 22px 20px}.kicker{margin-bottom:18px;font-size:.53rem;letter-spacing:.16em}h1{font-size:clamp(3rem,15vw,4.5rem)}.description{max-width:285px;margin:20px 0 22px;font-size:.85rem}.enter{padding:13px 15px 13px 18px}.visual{height:49vh;min-height:300px;margin-top:0}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="scene"><header class="topbar"><a class="brand" href="./index.html">Entrena<span>Calculo</span></a><div class="coords">EC / 001</div></header><main class="hero"><section class="copy"><div class="kicker">entrena sin limites</div><h1>Entrena<span>Calculo</span></h1><p class="description">Convierte cada problema en <strong>precision</strong>. Practica, domina y vuelve a intentarlo.</p><a class="enter" href="./app.html?cat=calculo">Entrar <span>→</span></a></section><section class="visual" aria-label="Modelo 3D de numeros"><canvas id="number-model"></canvas><div class="visual-label">precision / movimiento / foco</div></section></main></div>
<script>
const canvas=document.getElementById('number-model'),ctx=canvas.getContext('2d'),dots=[],dust=[],rings=[];const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;let width=0,height=0,dpr=1,radius=0;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);width=canvas.clientWidth;height=canvas.clientHeight;canvas.width=width*dpr;canvas.height=height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);radius=Math.min(width,height)*.39;buildModel()}
function buildModel(){dots.length=0;dust.length=0;rings.length=0;const total=Math.min(920,Math.max(470,Math.floor(width*height/1150))),golden=Math.PI*(3-Math.sqrt(5));for(let i=0;i<total;i++){const y=1-(i+.5)*2/total,r=Math.sqrt(1-y*y),a=golden*i;dots.push({x:Math.cos(a)*r,y,z:Math.sin(a)*r,char:String(Math.floor(Math.random()*10)),size:.48+Math.random()*.8})}for(let i=0;i<150;i++){const a=Math.random()*Math.PI*2,b=Math.acos(2*Math.random()-1),r=1.1+Math.random()*.5;dust.push({x:Math.sin(b)*Math.cos(a)*r,y:Math.cos(b)*r,z:Math.sin(b)*Math.sin(a)*r,size:Math.random()*2.3+.5})}for(let i=0;i<4;i++)rings.push({tilt:(i-1.5)*.4,phase:i*Math.PI*.43,width:1+i%2*.8,color:i%2?'104,203,255':'164,132,255'})}
function rotate(v,ry,rx,rz){let x=v.x*Math.cos(ry)-v.z*Math.sin(ry),z=v.x*Math.sin(ry)+v.z*Math.cos(ry),y=v.y*Math.cos(rx)-z*Math.sin(rx);z=v.y*Math.sin(rx)+z*Math.cos(rx);return{x:x*Math.cos(rz)-y*Math.sin(rz),y:x*Math.sin(rz)+y*Math.cos(rz),z}}
function project(v,cx,cy){const scale=radius/(2.72-v.z);return{x:cx+v.x*scale,y:cy+v.y*scale,z:v.z}}
function draw(time){const t=reduceMotion?0:time*.00022,ry=t,rx=Math.sin(t*.7)*.13,rz=t*.23,cx=width*.53,cy=height*.52;ctx.clearRect(0,0,width,height);const projectedDust=dust.map(p=>{const q=rotate(p,ry,rx,rz);return{...project(q,cx,cy),size:p.size,depth:(q.z+1.5)/3}}).sort((a,b)=>a.depth-b.depth);for(const p of projectedDust){ctx.fillStyle=`rgba(133,177,255,${.08+p.depth*.3})`;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(.6+p.depth),0,Math.PI*2);ctx.fill()}for(const ring of rings){const back=[],front=[];for(let i=0;i<=100;i++){const a=i/100*Math.PI*2;let v={x:Math.cos(a)*1.27,y:Math.sin(a)*1.27,z:0};v=rotate(v,ring.phase+t*.45,ring.tilt,rz+ring.phase);const p=project(v,cx,cy);(p.z<0?back:front).push(p)}for(const segment of [back,front]){ctx.beginPath();segment.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle=`rgba(${ring.color},${segment===back ? 0.16 : 0.58})`;ctx.lineWidth=ring.width;ctx.shadowColor=`rgba(${ring.color},.6)`;ctx.shadowBlur=segment===front?10:3;ctx.stroke()}ctx.shadowBlur=0}const rendered=dots.map(p=>{const q=rotate(p,ry,rx,rz),pos=project(q,cx,cy);return{p,pos,depth:(q.z+1)/2}}).sort((a,b)=>a.depth-b.depth);for(const item of rendered){const{x,y}=item.pos,depth=item.depth;if(x<-40||x>width+40||y<-40||y>height+40)continue;const alpha=.07+depth*.86,size=item.p.size*(.52+depth*1.4),font=Math.max(7,size*radius*.04);ctx.font=`${font}px Georgia,serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=`rgba(244,244,250,${alpha})`;if(depth>.76){ctx.shadowColor='rgba(137,176,255,.7)';ctx.shadowBlur=7}else ctx.shadowBlur=0;ctx.fillText(item.p.char,x,y)}ctx.shadowBlur=0;if(!reduceMotion)requestAnimationFrame(draw)}
window.addEventListener('resize',resize,{passive:true});resize();if(reduceMotion)draw(0);else requestAnimationFrame(draw);
</script>
</body>

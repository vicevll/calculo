<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EntrenaCalculo</title>
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07070a;--bg2:#0b0b10;--bg3:#111118;--bg4:#181820;
  --border:rgba(255,255,255,.06);--border-hover:rgba(255,255,255,.1);
  --text:#e6e6f0;--text2:#9090a6;--text3:#585868;
  --accent:#5898f0;--accent-dim:rgba(88,152,240,.12);
  --green:#3dcc85;--orange:#f0a050;--red:#e85555;--purple:#a078f0;
  --pink:#e870a0;--teal:#40c4c4;
  --radius:10px;--radius-sm:7px;--radius-lg:14px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --transition:220ms cubic-bezier(.4,0,.2,1);
}
html{font-size:17px}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;
  display:flex;flex-direction:column;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
body::before,body::after{
  content:'';position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;
}
body::before{width:60vw;height:60vw;max-width:700px;max-height:700px;background:rgba(88,152,240,.14);top:-20%;left:-15%;animation:breathe 9s ease-in-out infinite}
body::after{width:55vw;height:55vw;max-width:600px;max-height:600px;background:rgba(160,120,240,.13);bottom:-20%;right:-15%;animation:breathe 11s ease-in-out infinite reverse}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

#bg-formulas{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg-formulas .f{position:absolute;color:var(--text);animation:floaty linear infinite}
#bg-formulas .f .katex{font-size:1em}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-26px) rotate(3deg)}}

main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px;padding:32px 20px;min-height:100vh}

.title{font-size:clamp(2.6rem,9vw,5.2rem);font-weight:900;letter-spacing:-1.5px;line-height:1.05;text-align:center;animation:fadeUp .8s cubic-bezier(.4,0,.2,1) both}
.title span{
  background:linear-gradient(90deg,var(--accent),var(--purple),var(--pink),var(--accent));
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:gradientShift 7s linear infinite;
}
@keyframes gradientShift{to{background-position:300% 0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}

.cards{display:grid;grid-template-columns:repeat(4,minmax(130px,190px));gap:16px;width:100%;justify-content:center}
.card{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:34px 16px;border-radius:var(--radius-lg);text-decoration:none;
  background:rgba(17,17,24,.55);border:1px solid var(--border);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:all var(--transition);cursor:pointer;
  animation:fadeUp .7s cubic-bezier(.4,0,.2,1) both;
}
.card:hover{transform:translateY(-8px);background:var(--bg3)}
.card .ico{font-size:1.7rem;font-weight:800;color:var(--text);letter-spacing:-.5px;transition:color var(--transition)}
.card .lbl{font-size:.95rem;font-weight:600;color:var(--text2)}
.card:nth-child(1){animation-delay:.15s}.card:nth-child(2){animation-delay:.25s}.card:nth-child(3){animation-delay:.35s}.card:nth-child(4){animation-delay:.45s}
.card.c-calculo:hover{border-color:var(--accent);box-shadow:0 12px 40px rgba(88,152,240,.3)}
.card.c-calculo:hover .ico{color:var(--accent)}
.card.c-m1:hover{border-color:var(--teal);box-shadow:0 12px 40px rgba(64,196,196,.3)}
.card.c-m1:hover .ico{color:var(--teal)}
.card.c-m2:hover{border-color:var(--orange);box-shadow:0 12px 40px rgba(240,160,80,.3)}
.card.c-m2:hover .ico{color:var(--orange)}
.card.c-metodos:hover{border-color:var(--purple);box-shadow:0 12px 40px rgba(160,120,240,.3)}
.card.c-metodos:hover .ico{color:var(--purple)}

@media(max-width:768px){
  html{font-size:15px}
  main{gap:36px}
  .cards{grid-template-columns:repeat(2,1fr);max-width:420px;gap:12px}
  .card{padding:26px 12px;gap:10px}
  .card .ico{font-size:1.4rem}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bg-formulas"></div>
<main>
  <h1 class="title">Entrena<span>Calculo</span></h1>
  <nav class="cards">
    <a class="card c-calculo" href="./app.html?cat=calculo"><span class="ico">&#x221e;</span><span class="lbl">Calculo</span></a>
    <a class="card c-m1" href="./app.html?cat=m1"><span class="ico">{ }</span><span class="lbl">M1</span></a>
    <a class="card c-m2" href="./app.html?cat=m2"><span class="ico">log</span><span class="lbl">M2</span></a>
    <a class="card c-metodos" href="./app.html?cat=metodos"><span class="ico">&#x0192;</span><span class="lbl">Metodos</span></a>
  </nav>
</main>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script>
const formulas = [
  {t:"\\frac{d}{dx}\\left[x^n\\right] = n\\,x^{n-1}", top:'8%', left:'6%', s:1.5, o:.14, d:13, delay:0},
  {t:"\\int x^n\\,dx = \\frac{x^{n+1}}{n+1}+C", top:'70%', left:'8%', s:1.3, o:.12, d:15, delay:1.2},
  {t:"\\lim_{x\\to 0}\\frac{\\sin x}{x} = 1", top:'14%', left:'62%', s:1.4, o:.14, d:14, delay:.6},
  {t:"x = \\frac{-b \\pm \\sqrt{b^2-4ac}}{2a}", top:'30%', left:'74%', s:1.6, o:.12, d:16, delay:2},
  {t:"\\log_a(xy) = \\log_a x + \\log_a y", top:'62%', left:'70%', s:1.3, o:.13, d:12, delay:1.8},
  {t:"e^{i\\pi}+1 = 0", top:'80%', left:'30%', s:1.8, o:.15, d:17, delay:.3},
  {t:"\\int_a^b f(x)\\,dx", top:'22%', left:'30%', s:1.7, o:.12, d:13, delay:2.6},
  {t:"\\frac{d}{dx}\\left[\\sin x\\right] = \\cos x", top:'78%', left:'55%', s:1.4, o:.13, d:15, delay:1.5},
  {t:"\\lim_{x\\to\\infty}\\left(1+\\frac{1}{x}\\right)^x = e", top:'40%', left:'8%', s:1.4, o:.13, d:18, delay:.9},
  {t:"\\begin{cases} ax+by=c \\\\ dx+ey=f \\end{cases}", top:'48%', left:'58%', s:1.5, o:.12, d:14, delay:2.2},
  {t:"\\log_a x = \\frac{\\ln x}{\\ln a}", top:'10%', left:'40%', s:1.2, o:.11, d:16, delay:1.1},
  {t:"\\int e^x\\,dx = e^x + C", top:'88%', left:'80%', s:1.3, o:.13, d:13, delay:.4},
];
const wrap = document.getElementById('bg-formulas');
formulas.forEach(f => {
  const div = document.createElement('div');
  div.className = 'f';
  div.style.cssText = `top:${f.top};left:${f.left};opacity:${f.o};animation-duration:${f.d}s;animation-delay:${f.delay}s;font-size:${f.s}rem`;
  div.innerHTML = katex.renderToString(f.t, {displayMode:true, throwOnError:false});
  wrap.appendChild(div);
});
</script>
</body>
</html>
